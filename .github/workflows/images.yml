# Every push to main or stage: run the tests, then build both images and push them to GitHub Container Registry.
#   main  -> ghcr.io/<owner>/signalchat-api:main   and signalchat-web:main
#   stage -> ghcr.io/<owner>/signalchat-api:stage  and signalchat-web:stage
# Watchtower on the server notices the new tag and restarts the containers. Nothing is built on the server.
name: images

on:
  push:
    branches: [main, stage]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # The SPA is built for one API: the address goes into the app and into its Content-Security-Policy.
  API_ORIGIN_MAIN: https://chat-api.vlados.tech
  API_ORIGIN_STAGE: https://chat-api-stage.vlados.tech

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Backend tests
        run: dotnet test backend/SignalChat.slnx
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint:ci
          npm run type-check
          npm run test:unit

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Name the image and pick the API address
        id: target
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/signalchat-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "api_origin=${API_ORIGIN_MAIN}" >> "$GITHUB_OUTPUT"
          else
            echo "api_origin=${API_ORIGIN_STAGE}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component == 'api' && 'backend' || 'frontend' }}
          file: ${{ matrix.component == 'api' && 'backend/Dockerfile' || 'frontend/Dockerfile' }}
          platforms: linux/amd64
          push: true
          # The branch name is the tag Watchtower follows; the commit tag is for rollbacks.
          tags: |
            ${{ steps.target.outputs.image }}:${{ github.ref_name }}
            ${{ steps.target.outputs.image }}:${{ github.sha }}
          build-args: |
            VITE_API_ORIGIN=${{ matrix.component == 'web' && steps.target.outputs.api_origin || '' }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.component }}
