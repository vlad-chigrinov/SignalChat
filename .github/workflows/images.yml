# Every push to main or stage: run the tests, then build both images and push them to GitHub Container Registry.
#   main  -> ghcr.io/<owner>/signalchat-api:main   and signalchat-web:main
#   stage -> ghcr.io/<owner>/signalchat-api:stage  and signalchat-web:stage
# Watchtower on the server notices the new tag and restarts the containers. Nothing is built on the server.
name: images

on:
  push:
    branches: [main, stage]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # The SPA is built for one API: the address goes into the app and into its Content-Security-Policy.
  API_ORIGIN_MAIN: https://chat-api.vlados.tech
  API_ORIGIN_STAGE: https://chat-api-stage.vlados.tech

jobs:
  # Three kinds of tests: backend (xUnit), frontend (Vitest), e2e (Playwright on the mock API). Each one runs even when
  # an earlier one failed, and the run page gets one report with a row per kind (.github/scripts/test-summary).
  test:
    runs-on: ubuntu-latest
    env:
      RESULTS_DIR: ${{ github.workspace }}/ci-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Backend tests
        run: dotnet test backend/SignalChat.slnx --logger "trx;LogFileName=backend.trx" --results-directory "$RESULTS_DIR/backend"
      - name: Frontend lint and types
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          npm run lint:ci
          npm run type-check
      - name: Frontend unit tests
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx vitest run --reporter=default --reporter=json --outputFile.json="$RESULTS_DIR/frontend.json"
      # Only the headless shell: the e2e run is headless and never starts the full Chrome, which is another download.
      - name: Install the e2e browser
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium
      - name: E2E tests
        if: ${{ !cancelled() }}
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/ci-results/e2e.json
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --reporter=list,json,html
      - name: Test report script checks
        if: ${{ !cancelled() }}
        run: node --test ".github/scripts/test-summary/*.test.mjs"
      - name: Test report
        if: ${{ !cancelled() }}
        run: node .github/scripts/test-summary/index.mjs "$RESULTS_DIR"
      # Raw results, and the Playwright report with traces of failed e2e tests, to open from the run page.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: |
            ci-results
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Name the image and pick the API address
        id: target
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/signalchat-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "api_origin=${API_ORIGIN_MAIN}" >> "$GITHUB_OUTPUT"
          else
            echo "api_origin=${API_ORIGIN_STAGE}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component == 'api' && 'backend' || 'frontend' }}
          file: ${{ matrix.component == 'api' && 'backend/Dockerfile' || 'frontend/Dockerfile' }}
          platforms: linux/amd64
          push: true
          # The branch name is the tag Watchtower follows; the commit tag is for rollbacks.
          tags: |
            ${{ steps.target.outputs.image }}:${{ github.ref_name }}
            ${{ steps.target.outputs.image }}:${{ github.sha }}
          build-args: |
            VITE_API_ORIGIN=${{ matrix.component == 'web' && steps.target.outputs.api_origin || '' }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.component }}
