# Shared infrastructure for both environments: one PostgreSQL server, the RustFS object store for chat photos, and Watchtower.
# Start this first, before docker-compose.main.yml and docker-compose.stage.yml.
#   docker compose --env-file infra.env -f docker-compose.infra.yml up -d
# Every container, network and volume carries the signalchat- prefix so it cannot clash with other services on the host.
# Host memory is tight and shared with other services: every container has a hard limit and no swap.

name: signalchat-infra

services:
  db:
    image: postgres:17-alpine
    container_name: signalchat-db
    restart: unless-stopped
    environment:
      # The superuser can log in from inside the container only (see pg_hba.conf), never over the network.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra.env}
      # Read once by postgres/10-create-databases.sh on the first start of an empty volume.
      MAIN_DB_PASSWORD: ${MAIN_DB_PASSWORD:?set MAIN_DB_PASSWORD in infra.env}
      STAGE_DB_PASSWORD: ${STAGE_DB_PASSWORD:?set STAGE_DB_PASSWORD in infra.env}
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - listen_addresses=*
      - -c
      - password_encryption=scram-sha-256
      # Failed and successful logins are logged: the database is reachable from the internet through Traefik.
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      # Two environments, each API pool is capped at 10 (PostgresConnectionString): 20 of 30, the rest is headroom.
      - -c
      - max_connections=30
      - -c
      - shared_buffers=48MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
    # No "ports": the database is not published on the host. Outside clients come in through Traefik (labels below),
    # the API containers of both environments through the signalchat-data network.
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-web}
      # TLS for the database is Traefik's: it terminates it with the same Let's Encrypt resolver as the web hosts and
      # routes by SNI, so the client must use sslmode=require (or stronger). A connection without TLS matches no router.
      - traefik.tcp.routers.signalchat-db.rule=HostSNI(`${DB_PUBLIC_HOST:-chat-db.vlados.tech}`)
      - traefik.tcp.routers.signalchat-db.entrypoints=${TRAEFIK_DB_ENTRYPOINT:-postgres}
      - traefik.tcp.routers.signalchat-db.tls=true
      - traefik.tcp.routers.signalchat-db.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      # TLS options can be defined only in Traefik's file provider, so the name is a setting. "default" always exists.
      # psql/libpq 17+ need an option that offers the ALPN protocol "postgresql" (traefik/postgres-alpn.yml).
      - traefik.tcp.routers.signalchat-db.tls.options=${DB_TLS_OPTIONS:-default}
      - traefik.tcp.services.signalchat-db.loadbalancer.server.port=5432
    volumes:
      - signalchat-db-data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/10-create-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    networks:
      - signalchat-data
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    memswap_limit: 160m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true

  # S3-compatible object store for the photos of chat messages. One server, one bucket and one access key per environment
  # (signalchat-main-media, signalchat-stage-media); the keys are made by deploy/rustfs/provision.sh, see docs/deploy.md.
  # Not published on the host and not on Traefik: only the API containers reach it, by the name signalchat-rustfs on the
  # signalchat-data network. A photo is served to a browser by the API after a membership check, never straight from here.
  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: signalchat-rustfs
    restart: unless-stopped
    environment:
      # The root keys of the store. Only the one-time provisioning uses them; the APIs get keys of their own.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:?set RUSTFS_ROOT_USER in infra.env}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?set RUSTFS_ROOT_PASSWORD in infra.env}
      RUSTFS_VOLUMES: /data
      # The web console is off: nothing in the stack needs it, and it is one more thing to expose.
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_OBS_ENVIRONMENT: production
    # No "ports": S3 (9000) is reachable on the signalchat-data network only.
    volumes:
      - signalchat-rustfs-data:/data
    tmpfs:
      - /logs
      - /tmp
    networks:
      - signalchat-data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # About 50 MiB idle with the console off (measured); a photo is under 3 MiB. The hard limit keeps the store from
    # taking the host's memory, and the server is shared.
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true

  # Pulls the new :main and :stage images and recreates the labelled containers. Touches nothing else on the host:
  # only containers with the enable label and this scope are watched, so the database and other services are left alone.
  watchtower:
    image: nickfedor/watchtower:1.23.2
    container_name: signalchat-watchtower
    restart: unless-stopped
    command:
      - --label-enable
      - --scope
      - signalchat
      - --cleanup
      - --rolling-restart
      - --interval
      - "${WATCHTOWER_POLL_INTERVAL_SECONDS:-120}"
      - --no-startup-message
    environment:
      # Re-read the credentials file on every poll, so a rotated token needs no restart.
      DOCKER_CONFIG: /config
    volumes:
      # Root-equivalent access to Docker: this is how Watchtower recreates containers. Keep it on this one container.
      - /var/run/docker.sock:/var/run/docker.sock
      # Credentials of the image registry (a JSON file written by `docker login`). See docs/deploy.md.
      - ${REGISTRY_CONFIG_FILE:?set REGISTRY_CONFIG_FILE in infra.env}:/config/config.json:ro
    labels:
      - com.centurylinklabs.watchtower.scope=signalchat
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.2
    security_opt:
      - no-new-privileges:true

networks:
  # The API containers of both environments join this network to reach the database (signalchat-db) and the photo store (signalchat-rustfs).
  signalchat-data:
    name: signalchat-data
    driver: bridge
  # The existing Traefik network: Traefik reaches the database through it.
  traefik:
    name: ${TRAEFIK_NETWORK:-web}
    external: true

volumes:
  signalchat-db-data:
    name: signalchat-db-data
  signalchat-rustfs-data:
    name: signalchat-rustfs-data
