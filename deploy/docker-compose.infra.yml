# Shared infrastructure for both environments: one PostgreSQL server and Watchtower.
# Start this first, before docker-compose.main.yml and docker-compose.stage.yml.
#   docker compose --env-file infra.env -f docker-compose.infra.yml up -d
# Every container, network and volume carries the signalchat- prefix so it cannot clash with other services on the host.
# Host memory is tight and shared with other services: every container has a hard limit and no swap.

name: signalchat-infra

services:
  # One-shot: creates a self-signed TLS certificate for the database on first start and hands it to the postgres user.
  # Clients connect with sslmode=require (encrypted); to verify the server, replace server.crt/server.key in the volume.
  db-certs:
    image: alpine/openssl:3.5.4
    container_name: signalchat-db-certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -s /certs/server.key ]; then
          openssl req -new -x509 -days 3650 -nodes -newkey rsa:3072 \
            -subj "/CN=$${DB_PUBLIC_HOST}" \
            -addext "subjectAltName=DNS:$${DB_PUBLIC_HOST},DNS:signalchat-db" \
            -keyout /certs/server.key -out /certs/server.crt
        fi
        chown 70:70 /certs/server.key /certs/server.crt
        chmod 600 /certs/server.key
        chmod 644 /certs/server.crt
    environment:
      DB_PUBLIC_HOST: ${DB_PUBLIC_HOST:-chat-db.vlados.tech}
    volumes:
      - signalchat-db-certs:/certs
    restart: "no"
    mem_limit: 32m
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:17-alpine
    container_name: signalchat-db
    restart: unless-stopped
    depends_on:
      db-certs:
        condition: service_completed_successfully
    environment:
      # The superuser can log in from inside the container only (see pg_hba.conf), never over the network.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra.env}
      # Read once by postgres/10-create-databases.sh on the first start of an empty volume.
      MAIN_DB_PASSWORD: ${MAIN_DB_PASSWORD:?set MAIN_DB_PASSWORD in infra.env}
      STAGE_DB_PASSWORD: ${STAGE_DB_PASSWORD:?set STAGE_DB_PASSWORD in infra.env}
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - listen_addresses=*
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      # Failed and successful logins are logged: the port is open to the internet, so watch the log.
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      # Two environments, each API pool is capped at 10 (PostgresConnectionString): 20 of 30, the rest is headroom.
      - -c
      - max_connections=30
      - -c
      - shared_buffers=48MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
    ports:
      # The one deliberately public port. Change POSTGRES_PUBLIC_PORT when 5432 is taken by another service.
      - "${POSTGRES_PUBLIC_PORT:-5432}:5432"
    volumes:
      - signalchat-db-data:/var/lib/postgresql/data
      - signalchat-db-certs:/certs:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/10-create-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    networks:
      - signalchat-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    memswap_limit: 160m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true

  # Pulls the new :main and :stage images and recreates the labelled containers. Touches nothing else on the host:
  # only containers with the enable label and this scope are watched, so the database and other services are left alone.
  watchtower:
    image: nickfedor/watchtower:1.23.2
    container_name: signalchat-watchtower
    restart: unless-stopped
    command:
      - --label-enable
      - --scope
      - signalchat
      - --cleanup
      - --rolling-restart
      - --interval
      - "${WATCHTOWER_POLL_INTERVAL_SECONDS:-120}"
      - --no-startup-message
    environment:
      # Re-read the credentials file on every poll, so a rotated token needs no restart.
      DOCKER_CONFIG: /config
    volumes:
      # Root-equivalent access to Docker: this is how Watchtower recreates containers. Keep it on this one container.
      - /var/run/docker.sock:/var/run/docker.sock
      # Credentials of the image registry (a JSON file written by `docker login`). See docs/deploy.md.
      - ${REGISTRY_CONFIG_FILE:?set REGISTRY_CONFIG_FILE in infra.env}:/config/config.json:ro
    labels:
      - com.centurylinklabs.watchtower.scope=signalchat
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.2
    security_opt:
      - no-new-privileges:true

networks:
  # The API containers of both environments join this network to reach the database by the name signalchat-db.
  signalchat-data:
    name: signalchat-data
    driver: bridge

volumes:
  signalchat-db-data:
    name: signalchat-db-data
  signalchat-db-certs:
    name: signalchat-db-certs
