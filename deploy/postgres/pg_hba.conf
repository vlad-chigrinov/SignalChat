# Who may connect to the shared PostgreSQL. First matching line wins.
# The database is not published on the host. Outside clients reach it only through Traefik, which terminates TLS and
# requires it (a plain connection matches no Traefik router); the API containers connect over the internal Docker network.
# So here: a password is mandatory, and each environment's role can reach its own database only.
# The superuser cannot log in over the network at all.

# Inside the container (docker exec, the health check, the first-start init scripts).
local   all                 all                                 trust
host    all                 all         127.0.0.1/32            trust
host    all                 all         ::1/128                 trust

# main environment
host    signalchat_main     signalchat_main     0.0.0.0/0       scram-sha-256
host    signalchat_main     signalchat_main     ::/0            scram-sha-256

# stage environment
host    signalchat_stage    signalchat_stage    0.0.0.0/0       scram-sha-256
host    signalchat_stage    signalchat_stage    ::/0            scram-sha-256

# Everything else is refused.
host    all                 all         0.0.0.0/0               reject
host    all                 all         ::/0                    reject
