# Who may connect to the shared PostgreSQL. First matching line wins.
# The port is open to the internet, so: TLS is mandatory, a password is mandatory, and each environment's role
# can reach its own database only. The superuser cannot log in over the network at all.

# Inside the container (docker exec, the health check, the first-start init scripts).
local   all                 all                                 trust
host    all                 all         127.0.0.1/32            trust
host    all                 all         ::1/128                 trust

# main environment
hostssl signalchat_main     signalchat_main     0.0.0.0/0       scram-sha-256
hostssl signalchat_main     signalchat_main     ::/0            scram-sha-256

# stage environment
hostssl signalchat_stage    signalchat_stage    0.0.0.0/0       scram-sha-256
hostssl signalchat_stage    signalchat_stage    ::/0            scram-sha-256

# Everything else, including any connection without TLS, is refused.
host    all                 all         0.0.0.0/0               reject
host    all                 all         ::/0                    reject
