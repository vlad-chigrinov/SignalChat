# Security headers for every response. Each location of nginx.conf includes this file: nginx stops
# inheriting server-level add_header as soon as a location sets its own, so the include is per location.
#
# The Content-Security-Policy mirrors buildContentSecurityPolicy() in vite.csp.ts, plus frame-ancestors,
# which browsers ignore in a <meta> tag. nginx.csp.spec.ts fails when the two drift apart.
#
# Strict-Transport-Security is deliberately absent: Traefik and the backend set it, and a second copy
# would duplicate the header.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://*.googleusercontent.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Google avatars are loaded cross-origin: the browser then sends only the page origin, never its path.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
