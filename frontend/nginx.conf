# Server block of the SPA. The image copies it to /etc/nginx/conf.d/default.conf.
# This host serves the SPA only. The API has its own host name (chat-api...), routed to the backend by Traefik.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Container health check. Answers without touching the files.
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Build output carries a content hash in its name: the same URL never changes, so cache it for a year.
    # A missing hashed file is a 404, never the SPA shell, which would be served as a script.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html and every route of the SPA (vue-router history mode): revalidate on each load and
    # fall back to index.html for any path that is not a file.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
